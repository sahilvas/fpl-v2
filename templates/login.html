
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPL - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.95);
        }
        .btn-primary {
            background: #1e3c72;
            border: none;
            padding: 10px 20px;
        }
        .btn-primary:hover {
            background: #2a5298;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
        }
        .logo {
            width: 100px;
            margin-bottom: 20px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <!-- Login Form -->
                <div class="card p-4 mb-4" id="loginForm">
                    <div class="card-body text-center">
                        <img src="{{ url_for('static', filename='lpl-2.webp') }}" alt="IPL Logo" class="logo">
                        <h3 class="mb-4">Login</h3>
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert {% if 'success' in message.lower() %}alert-success{% else %}alert-danger{% endif %}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        <form action="{{ url_for('login') }}" method="POST">
                            <div class="mb-3">
                                <input type="email" class="form-control" name="email" placeholder="Email" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" name="password" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                            <div class="d-flex justify-content-between">
                                <a href="#" onclick="showForm('resetForm')" class="text-muted">Forgot Password?</a>
                                <a href="#" onclick="showForm('signupForm')" class="text-muted">Sign Up</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Sign Up Form -->
                <div class="card p-4 mb-4" id="signupForm" style="display: none;">
                    <div class="card-body text-center">
                        <img src="{{ url_for('static', filename='lpl-2.webppeg') }}" alt="IPL Logo" class="logo">
                        <h3 class="mb-4">Create Account</h3>
                        <form action="{{ url_for('signup') }}" method="POST" autocomplete="off" onsubmit="return validatePasswords()">
                            <div class="mb-3">
                                <input type="text" class="form-control" name="username" placeholder="Username" required>
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control" name="email" placeholder="Email" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required 
                                       pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                                       title="Password must be at least 8 characters long and include uppercase, lowercase, number and special character"
                                       autocomplete="new-password">
                            </div>
                            <div class="mb-3">
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required
                                       pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                                       title="Password must be at least 8 characters long and include uppercase, lowercase, number and special character"
                                       autocomplete="new-password">
                                <div id="password-error" class="text-danger" style="display:none">Passwords do not match</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Sign Up</button>
                            <a href="#" onclick="showForm('loginForm')" class="text-muted">Already have an account? Login</a>
                        </form>
                    </div>
                    <script>
                        function validatePasswords() {
                            const password = document.getElementById('password').value;
                            const confirmPassword = document.getElementById('confirm_password').value;
                            const errorDiv = document.getElementById('password-error');
                            
                            if (password !== confirmPassword) {
                                errorDiv.style.display = 'block';
                                return false;
                            }
                            errorDiv.style.display = 'none';
                            return true;
                        }
                    </script>
                </div>

                <!-- Reset Password Form -->
                <div class="card p-4" id="resetForm" style="display: none;">
                    <div class="card-body text-center">
                        <img src="{{ url_for('static', filename='lpl-2.webppeg') }}" alt="IPL Logo" class="logo">
                        <h3 class="mb-4">Reset Password</h3>
                        <form action="{{ url_for('reset_password') }}" method="POST">
                            <div class="mb-3">
                                <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Reset Password</button>
                            <a href="#" onclick="showForm('loginForm')" class="text-muted">Back to Login</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showForm(formId) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById(formId).style.display = 'block';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
