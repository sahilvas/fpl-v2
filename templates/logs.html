
<!DOCTYPE html>
<html>
<head>
    <title>Log Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
        }

        .log-container {
            font-family: monospace;
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            font-size: 14px;
        }
        
        .log-line {
            white-space: pre-wrap;
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #ddd;
            word-break: break-word;
        }

        .timestamp {
            color: #666;
            font-weight: bold;
            margin-right: 10px;
            display: block;
        }

        .message {
            color: #333;
            display: block;
        }

        .nan {
            color: red;
            font-weight: bold;
        }

        .dataframe {
            border-collapse: collapse;
            margin: 20px 0;
            width: 100%;
            overflow-x: auto;
            display: block;
        }

        .dataframe th, .dataframe td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            min-width: 100px;
        }

        .dataframe th {
            background-color: #4CAF50;
            color: white;
        }

        .dataframe tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .dataframe tr:hover {
            background-color: #ddd;
        }

        @media screen and (max-width: 600px) {
            body {
                padding: 10px;
            }

            .log-container {
                padding: 5px;
                font-size: 12px;
            }

            .log-line {
                padding: 3px;
            }
        }
    </style>
</head>
<body>

        <div class="log-container">
            {% for log in logs[:100] %}
                <div class="log-line">
                    <span class="timestamp">{{ log.timestamp }}</span>
                    <span class="message">{{ log.message|replace('NaN', '<span class="nan">NaN</span>')|replace('Player name alias not found for', '<span class="nan">Player name alias not found for</span>')|safe }}</span>                
                </div>
            {% endfor %}
        </div>

   

</body>
</html>
